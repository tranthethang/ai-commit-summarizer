# Metadata
sonar.projectKey=asum
sonar.projectName=asum
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8

# Source Code Configurations
sonar.sources=src
sonar.rust.cargo.manifestPaths=Cargo.toml

# Exclusions
sonar.exclusions=\
  target/**,\
  coverage/**,\
  assets/**,\
  docs/**,\
  **/.git/**,\
  **/.github/**,\
  **/.cursor/**,\
  **/.scannerwork/**,\
  **/.idea/**,\
  **/.vscode/**,\
  **/*.sh,\
  asum.toml.example,\
  screenshot.png,\
  LICENSE,\
  README.md,\
  AGENTS.md,\
  sonar-project.properties

# Code Coverage Reports
sonar.rust.lcov.reportPaths=coverage/lcov.info
sonar.rust.cobertura.reportPaths=target/tarpaulin/cobertura.xml

# Linter Reports (Clippy)
sonar.rust.clippy.reportPaths=clippy-report.json